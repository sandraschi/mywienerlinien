[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vienna-transit-mcp"
version = "1.0.0"
description = "Vienna Transit MCP Server - FastMCP 2.13 compliant MCP server for Vienna public transport information"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Vienna Transit MCP Contributors"}
]
keywords = ["mcp", "fastmcp", "vienna", "transit", "public-transport", "wiener-linien"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

dependencies = [
    "fastapi==0.110.2",
    "uvicorn[standard]>=0.35",
    "python-socketio[asyncio]==5.11.2",
    "SQLAlchemy==2.0.23",
    "psycopg2-binary==2.9.9",
    "requests==2.31.0",
    "python-dotenv>=1.1.0",
    "Jinja2==3.1.2",
    "cachetools==5.3.3",
    "typing-extensions>=4.10.0",
    "tqdm==4.66.1",
    "partridge==0.1.0",
    "gtfs-kit==12.0.0",
    # MCP Server dependencies
    "fastmcp>=2.14.0,<3.0.0",
    "pydantic>=2.5.0",
    # ML dependencies (Phase 3C)
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.5.0",
]

[project.scripts]
vienna-transit-mcp = "frontend.mcp_server.server:mcp"

[tool.setuptools]
packages = ["frontend", "frontend.mcp_server"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.json"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

