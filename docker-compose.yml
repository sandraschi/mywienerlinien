networks:
  wienerlinien-network:
    driver: bridge

volumes:
  loki_data: {}
  grafana-storage: {}
  postgres_data: {}
  wienerlinien_data: {}
  gtfs_data: {}

services:
  # NOTE: the PostgreSQL/PostGIS `db` service was removed in the full-SQLite
  # cutover (app tables live in data/app.db, GTFS reads in the gtfs-mcp
  # snapshot). postgres_data volume is kept so no historical data is lost.

  # NOTE: the GTFS Data Loader service was removed in Phase 3 (its scripts
  # are deleted; feed refresh lives in gtfs-mcp now). Loki/Grafana below stay.

  # Frontend Application
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: wienerlinien-frontend:latest
    container_name: wienerlinien-frontend
    environment:
      - APP_ENV=development
      - PYTHONPATH=/app
    volumes:
      - wienerlinien_data:/app/data
      - gtfs_data:/app/scripts/gtfs_data
    ports:
      - "3079:3080"
    networks:
      - wienerlinien-network
    command: >
      sh -c "uvicorn app:app --host 0.0.0.0 --port 3080"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3080/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3193:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    networks:
      - wienerlinien-network
    restart: unless-stopped

  # Promtail - Log Collector
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./frontend/logs:/logs
      - ./promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - wienerlinien-network
    depends_on:
      - loki
    restart: unless-stopped

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3140:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-windsurf123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_BASIC_ENABLED=true
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - wienerlinien-network
    depends_on:
      - loki
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
