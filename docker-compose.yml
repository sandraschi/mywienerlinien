version: '3.8'

networks:
  wienerlinien-network:
    driver: bridge

volumes:
  loki_data: {}
  grafana-storage: {}
  postgres_data: {}

services:
  # Database
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: wienerlinien-db
    environment:
      POSTGRES_USER: wienerlinien
      POSTGRES_PASSWORD: wienerlinien
      POSTGRES_DB: wienerlinien
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    networks:
      - wienerlinien-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wienerlinien -d wienerlinien"]
      interval: 10s
      timeout: 5s
      retries: 5

  # GTFS Data Loader
  gtfs-loader:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wienerlinien-gtfs-loader
    environment:
      - DATABASE_URL=postgresql://wienerlinien:wienerlinien@db:5432/wienerlinien
      - PGPASSWORD=wienerlinien
      - GTFS_LOG_DIR=/logs
      - GTFS_REFRESH_DAYS=${GTFS_REFRESH_DAYS:-7}
      - GTFS_ZIP_PATH=/app/scripts/gtfs_data/wienerlinien-gtfs.zip
      - GTFS_METADATA_DIR=/app/scripts/gtfs_data
    volumes:
      - ./frontend:/app
      - ./scripts:/app/scripts
      - ./db/init-scripts:/app/db/init-scripts
      - ./requirements-db.txt:/app/requirements-db.txt
      - ./models:/app/models
      - ./data:/app/data
      - ./frontend/logs:/logs
    networks:
      - wienerlinien-network
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "
      echo 'Waiting for PostgreSQL to be ready...' &&
      until pg_isready -h db -U wienerlinien -d wienerlinien -q; do
        echo 'PostgreSQL is not ready yet. Retrying in 5 seconds...' &&
        sleep 5
      done &&
      echo 'Creating database schema...' &&
      psql -h db -U wienerlinien -d wienerlinien -f /app/db/init-scripts/01_init_db.sql &&
      echo 'Installing Python dependencies...' &&
      pip install -r /app/requirements-db.txt &&
      echo 'GTFS scheduled loader: running if stale...' &&
      python /app/scripts/gtfs_scheduled_loader.py &&
      echo 'GTFS scheduled loader finished.'
      "

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wienerlinien-frontend
    environment:
      - DATABASE_URL=postgresql://wienerlinien:wienerlinien@db:5432/wienerlinien
      - APP_ENV=development
    volumes:
      - ./frontend:/app
      - ./data:/app/data
      - ./scripts:/scripts
      - ./models:/models
    ports:
      - "3079:3080"
    networks:
      - wienerlinien-network
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uvicorn app:app --host 0.0.0.0 --port 3080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3080/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3193:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    networks:
      - wienerlinien-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Promtail - Log Collector
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./frontend/logs:/logs
      - ./promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - wienerlinien-network
    depends_on:
      - loki
    restart: unless-stopped

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3140:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-windsurf123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_BASIC_ENABLED=true
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - wienerlinien-network
    depends_on:
      - loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
